<!DOCTYPE html>
<html lang="es"><!--(ES) sirve para pone el idioma en español-->

<head><!--la etiqueta (HEAD) define el nombre que aparece en la pestaña del navegador-->
    <meta charset="UFT-8"><!--la etiqueta (META) sirve para proporcionar informacion sobre la pagina
    al navegador y a otros servidores esta informacion se conoce como metadatos-->
    <meta name="viewport" content="width
    =device-width,initial-scale=1.0"><!--la etiqueta (META) permite ajustar el tamaño de la pagina-->
    <title>iniciar sesion inventario ADSO</title><!--la etiqueta (TITLE) sirve para poner el nombre de la pagina-->
    <link href="css/estilos.css" rel="stylesheet"><!--la etiqueta (LINK) llama los estilos personaliszados
    que se encuemtran en la carpeta previamente creada llamada (CSS) en el archivo (estilos.css)-->
</head>
<body class="login-fondo"><!--la etiqueta (BODY) sirve para todo el contenido principa de la pagina-->

    <main class="login-card"><!--la etiqueta (MAIN) sirve para mostar la informacion mas importante de la pagina-->
        <header class="login-encabezado"><!--la etiqueta (HEADER) sirve para el encabezado del login-->
            <i
             class="bi bi-shop display-4 text-sena"></i><!--icono de la tienda-->
            <h1 class="h3 fw-bold">INVENTARIO SENA</h1><!--la etiqueta (H1) sirve para crear el titulo principal-->
            <p class="text-secondary mb-0">ingresa tus credenciales para continuar</p><!--la etiqueta (P) sirve para crear un parrafo-->
        </header>
        <form action="dashboard.html" method="get"><!--la etiqueta (FORM) permite crear el contenido de
            un formulario cuando se envia nos lleva a la ruta (dashboard.html) y el (method) nos envia
            la informacion con (get)-->
            <div class="form-floating mb-3"><!--la etiqueta (DIV) sirve para agrupar varios elementos en un mismo contenedor-->
                <!--<label for="correo">correo electronico</label>!>--><!--la etiqueta (LABEL) sirve para crear una
                etiqueta o descripcion para un campo de un formulario y con el for conecta con el input-->
                <input type="email" class="form-control" id="correo"placeholder="sena@correo.com"required><!--la etiqueta (INPUT)
                sirve para crear campos donde el usuario puede ingresar informacion o seleccionar opciones
                en el formulario y type obliga a que tenga el (@) y placeholder es un texto de ejemplo 
                required es que es un campo obligatorio-->
                <label for="correo"><i class="bi bi-envelope me-1"></i>correo electronico</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" clave placeholder="minimo 6 caracteres" minlength="6"required><!--
                type=password oculta lo que escribe el usuario y minlength exige almenos 6 caracteres-->
                <label for="clave"><i class="bi bi-lock me-1"></i>contrasena</label>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                <input class="form-check-input" type="checkbox"id="recordar"><!--type=checkbox es para una casilla de verificacion-->
                <label class="form-check-label" for="recordar">Recordarme</label>
            </div>
            <a href="#" class="small text-decoration-none">olvido su contrasena</a>
            </div>

            <button type="submit" class="btn btn-sena w-100 py-2
            fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1">ingresar</i></button><!--envia el formulario antes de hacerlo revisa los campos required email y munglet-->
        </form><!--se realiza el cierre del formulario osea el cierre de la etiqueta (FORM)-->


            <p class="login-pie"> ¿No tienes cuenta? <a href="registro.html" class="text-decoration-none">registrate</a></p>
            <footer class="login-pie">2026 SENA - ADSO mixto</footer><!--el footer es para el pie de pagina-->
    </main>  
</body>
</html>
